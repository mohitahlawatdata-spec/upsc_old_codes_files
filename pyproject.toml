[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mainsmaster"
version = "0.1.0"
description = "UPSC handwritten essay evaluation and mentor app"
requires-python = ">=3.11,<3.13"
dependencies = [
  "streamlit>=1.40,<2",
  "sqlalchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4",
  "pgvector>=0.3,<1",
  "alembic>=1.13,<2",
  "google-genai>=1.0,<3",
  "pdf2image>=1.17,<2",
  "Pillow>=13,<14",
  "python-dotenv>=1,<2",
  "passlib[argon2]>=1.7,<2",
  "pydantic>=2.7,<3",
]

[project.optional-dependencies]
dev = ["boto3>=1.35,<2", "pytest>=8,<10", "ruff>=0.8,<1"]
s3 = ["boto3>=1.35,<2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint.per-file-ignores]
"scripts/preflight.py" = ["BLE001"]
"src/mainsmaster/ui/app.py" = ["BLE001"]
