name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install runtime and development tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -e ".[dev]" pip-audit
      - name: Lint
        run: ruff check src tests scripts migrations streamlit_app.py
      - name: Format check
        run: ruff format --check src tests scripts migrations streamlit_app.py
      - name: Offline tests
        run: pytest -q
      - name: Dependency audit
        run: pip-audit --requirement requirements.txt --progress-spinner off
